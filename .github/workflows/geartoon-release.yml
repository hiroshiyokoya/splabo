name: Release geartoon

on:
  push:
    tags:
      - 'geartoon-v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Step 1: ドラフトリリースを作成 ─────────────────────────────
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Extract changelog for this version
        id: changelog
        working-directory: apps/geartoon
        run: |
          VERSION="${GITHUB_REF_NAME#geartoon-v}"
          BODY=$(awk "/^## \[${VERSION}\]/{found=1; next} found && /^## /{exit} found{print}" CHANGELOG.md)
          if [ -z "$BODY" ]; then
            BODY="詳細は [CHANGELOG](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/apps/geartoon/CHANGELOG.md) を参照してください。"
          fi
          # イシュー番号 (#xx) をリリースノートから除去
          BODY=$(echo "$BODY" | sed 's/ (#[0-9]*[0-9])//g')
          # インストール手順フッターを追加（VERSION をバージョン番号で置換）
          FOOTER=$(sed "s/VERSION/${VERSION}/g" .github/release-footer.md)

          echo "body<<ENDOFBODY" >> $GITHUB_OUTPUT
          echo "$BODY" >> $GITHUB_OUTPUT
          echo "$FOOTER" >> $GITHUB_OUTPUT
          echo "ENDOFBODY" >> $GITHUB_OUTPUT

      - name: Create draft release
        id: create-release
        env:
          # ⚠ body を直接 shell 展開すると本文中のバッククォート等が壊れるため
          # env 経由で読み込んでシェルパース対象から外す。
          RELEASE_BODY: ${{ steps.changelog.outputs.body }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PAYLOAD=$(jq -n \
            --arg tag "${{ github.ref_name }}" \
            --arg name "geartoon ${GITHUB_REF_NAME#geartoon-}" \
            --arg body "$RELEASE_BODY" \
            '{tag_name: $tag, name: $name, body: $body, draft: true, prerelease: false}')
          release_id=$(gh api repos/${{ github.repository }}/releases \
            -X POST \
            --input - <<< "$PAYLOAD" \
            --jq '.id')
          echo "release_id=$release_id" >> $GITHUB_OUTPUT

  # ── Step 2: 各プラットフォームでビルド & アップロード ────────────
  build:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            sidecar-build: build:win

          - platform: macos-latest
            sidecar-build: build:mac-arm
            rust-target: aarch64-apple-darwin
            tauri-args: --target aarch64-apple-darwin

          # Linux は動作未検証のため一時的に無効化
          # - platform: ubuntu-22.04
          #   sidecar-build: build:linux

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # git タグ（例: geartoon-v0.5.2）からバージョンを取り出して
      # tauri.conf.json に書き込む
      - name: Sync version with git tag
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const path = 'apps/geartoon/app/src-tauri/tauri.conf.json';
            const conf = JSON.parse(fs.readFileSync(path, 'utf8'));
            conf.version = process.env.GITHUB_REF_NAME.replace(/^geartoon-v/, '');
            fs.writeFileSync(path, JSON.stringify(conf, null, 2) + '\n');
            console.log('version:', conf.version);
          "

      # Linux: Tauri が必要とするシステムライブラリ
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      # nxapi-wrapper サイドカーをビルド
      - name: Build nxapi-wrapper sidecar
        working-directory: apps/geartoon/tools/nxapi-wrapper
        run: |
          npm ci
          npm run ${{ matrix.sidecar-build }}

      # macOS: クロスコンパイル用 Rust ターゲットを追加
      - name: Add Rust target
        if: matrix.rust-target != ''
        run: rustup target add ${{ matrix.rust-target }}

      # フロントエンド依存関係をインストール（ルートで workspace 全体）。
      # Windows 上で生成したルート lockfile には各ランナー OS 版の rollup
      # native optional dep（例: @rollup/rollup-darwin-arm64）の package node が
      # 含まれず、npm ci / npm install は lockfile のツリーを尊重するため、
      # mac-arm 等のランナーで `Cannot find module @rollup/rollup-darwin-arm64`
      # （npm bug #4828）が発生する。ci.yml と同様に npm#4828 の公式回避策どおり
      # lockfile を削除してから install し、ランナー OS 上でプラットフォーム最適な
      # optional deps を解決させる。
      - name: Install app dependencies
        run: |
          rm -f package-lock.json
          npm install --no-audit --no-fund

      # Tauri ビルド & リリースへアップロード
      - name: Build and upload
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: './apps/geartoon/app'
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.tauri-args }}
