name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# 同一ブランチ/PR で新しい push が来たら古い実行をキャンセル
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── どのアプリに変更があったか判定（paths フィルタ）──────────────
  changes:
    runs-on: ubuntu-latest
    outputs:
      chartoon: ${{ steps.filter.outputs.chartoon }}
      geartoon: ${{ steps.filter.outputs.geartoon }}
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # ルート共通ファイル（workspace 設定・lockfile・CI 自身）変更時は
          # 両アプリともチェックする。
          filters: |
            common: &common
              - 'package.json'
              - 'package-lock.json'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/ci.yml'
            chartoon:
              - *common
              - 'apps/chartoon/**'
            geartoon:
              - *common
              - 'apps/geartoon/**'

  # ── chartoon: フロントエンド型チェック + ビルド ────────────────
  chartoon-frontend:
    needs: changes
    if: needs.changes.outputs.chartoon == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      # ルートで workspace 全体を install
      # npm ci はロックファイルに記録された optional deps しか展開できず、
      # Windows 上で生成した lockfile には Linux 版 rollup
      # (@rollup/rollup-linux-x64-gnu) の package node が含まれないため、
      # CI(ubuntu) で `Cannot find module @rollup/rollup-linux-x64-gnu`
      # が発生する（npm bug #4828）。install はプラットフォーム最適な
      # optional deps を解決するのでこの問題を回避できる。
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # tsc + vite build（chartoon の "build" は tsc && vite build）
      - name: Build (typecheck + vite)
        run: npm run build -w apps/chartoon/app

  # ── geartoon: フロントエンド型チェック + ビルド ────────────────
  geartoon-frontend:
    needs: changes
    if: needs.changes.outputs.geartoon == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      # npm ci ではなく npm install を使う理由は chartoon-frontend と同じ
      # （Windows 生成 lockfile に Linux 版 rollup optional dep が無い / npm#4828）。
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # tsc -b + vite build（geartoon の "build" は tsc -b && vite build）
      - name: Build (typecheck + vite)
        run: npm run build -w apps/geartoon/app

  # ── chartoon: cargo check（Tauri バックエンド）─────────────────
  chartoon-rust:
    needs: changes
    if: needs.changes.outputs.chartoon == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      # nxapi-sidecar をビルド（tauri.conf.json の externalBin として要求されるため、
      # 存在しないと build.rs の存在チェックで cargo check が失敗する）
      - name: Build nxapi-wrapper sidecar (linux)
        working-directory: apps/chartoon/tools/nxapi-wrapper
        run: |
          npm ci
          npm run build:linux

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/chartoon/app/src-tauri

      - name: cargo check
        working-directory: apps/chartoon/app/src-tauri
        run: cargo check --all-targets

  # ── geartoon: cargo check（Tauri バックエンド）─────────────────
  geartoon-rust:
    needs: changes
    if: needs.changes.outputs.geartoon == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Build nxapi-wrapper sidecar (linux)
        working-directory: apps/geartoon/tools/nxapi-wrapper
        run: |
          npm ci
          npm run build:linux

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/geartoon/app/src-tauri

      - name: cargo check
        working-directory: apps/geartoon/app/src-tauri
        run: cargo check --all-targets
