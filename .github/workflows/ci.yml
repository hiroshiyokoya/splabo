name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# 同一ブランチ/PR で新しい push が来たら古い実行をキャンセル
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── どのパスに変更があったか判定（paths フィルタ）──────────────
  changes:
    runs-on: ubuntu-latest
    outputs:
      splabo: ${{ steps.filter.outputs.splabo }}
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # ルート共通ファイル（workspace 設定・lockfile・CI 自身）または
          # アプリ本体（app / tools）に変更があればチェックする。
          filters: |
            splabo:
              - 'package.json'
              - 'package-lock.json'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/ci.yml'
              - 'app/**'
              - 'tools/**'

  # ── splabo: フロントエンド型チェック + ビルド ──────────────────
  splabo-frontend:
    needs: changes
    if: needs.changes.outputs.splabo == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      # ルートで workspace 全体を install。
      # Windows 上で生成したルート lockfile には Linux 版 rollup
      # (@rollup/rollup-linux-x64-gnu) の package node が含まれず、
      # npm ci / npm install どちらも lockfile のツリーを尊重するため CI(ubuntu)
      # で `Cannot find module @rollup/rollup-linux-x64-gnu`（npm bug #4828）が
      # 発生する。npm#4828 の公式回避策どおり lockfile を削除してから install し、
      # Linux ランナー上でプラットフォーム最適な optional deps を解決させる。
      - name: Install dependencies
        run: |
          rm -f package-lock.json
          npm install --no-audit --no-fund

      # tsc + vite build（splabo の "build" は tsc && vite build）
      - name: Build (typecheck + vite)
        run: npm run build -w app

  # ── splabo: cargo check（Tauri バックエンド）───────────────────
  splabo-rust:
    needs: changes
    if: needs.changes.outputs.splabo == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      # nxapi-sidecar をビルド（tauri.conf.json の externalBin として要求されるため、
      # 存在しないと build.rs の存在チェックで cargo check が失敗する）
      - name: Build nxapi-wrapper sidecar (linux)
        working-directory: tools/nxapi-wrapper
        run: |
          npm ci
          npm run build:linux

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: cargo check
        working-directory: app/src-tauri
        run: cargo check --all-targets
