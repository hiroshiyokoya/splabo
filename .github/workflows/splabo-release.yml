name: Release splabo

on:
  push:
    tags:
      - 'splabo-v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Step 1: ドラフトリリースを作成 ─────────────────────────────
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Extract changelog for this version
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#splabo-v}"
          BODY=$(awk "/^## \[${VERSION}\]/{found=1; next} found && /^## /{exit} found{print}" CHANGELOG.md)
          if [ -z "$BODY" ]; then
            BODY="詳細は [CHANGELOG](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/CHANGELOG.md) を参照してください。"
          fi
          # イシュー番号 (#xx) をリリースノートから除去
          BODY=$(echo "$BODY" | sed 's/ (#[0-9]*[0-9])//g')
          # インストール手順フッターを追加（VERSION をバージョン番号で置換）
          FOOTER=$(sed "s/VERSION/${VERSION}/g" .github/release-footer.md)

          echo "body<<ENDOFBODY" >> $GITHUB_OUTPUT
          echo "$BODY" >> $GITHUB_OUTPUT
          echo "$FOOTER" >> $GITHUB_OUTPUT
          echo "ENDOFBODY" >> $GITHUB_OUTPUT

      - name: Create draft release
        id: create-release
        env:
          # ⚠ steps.changelog.outputs.body はシェルへ直接補間すると本文中の
          # バッククォート (`...`) がコマンド置換として解釈されてしまうため、
          # env 経由で読み込んでシェルパース対象から外す。
          RELEASE_BODY: ${{ steps.changelog.outputs.body }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # rc/beta 等プレリリースサフィックス（-rc.1 等）付きタグは prerelease 扱いにする
          VERSION="${GITHUB_REF_NAME#splabo-v}"
          PRERELEASE=false
          case "$VERSION" in *-*) PRERELEASE=true ;; esac
          PAYLOAD=$(jq -n \
            --arg tag "${{ github.ref_name }}" \
            --arg name "splabo ${VERSION}" \
            --arg body "$RELEASE_BODY" \
            --argjson prerelease "$PRERELEASE" \
            '{tag_name: $tag, name: $name, body: $body, draft: true, prerelease: $prerelease}')
          release_id=$(gh api repos/${{ github.repository }}/releases \
            -X POST \
            --input - <<< "$PAYLOAD" \
            --jq '.id')
          echo "release_id=$release_id" >> $GITHUB_OUTPUT

  # ── Step 2: 各プラットフォームでビルド & アップロード ────────────
  build:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            sidecar-build: build:win

          - platform: macos-latest
            sidecar-build: build:mac-arm
            rust-target: aarch64-apple-darwin
            tauri-args: --target aarch64-apple-darwin

          # Linux は動作未検証のため一時的に無効化
          # - platform: ubuntu-22.04
          #   sidecar-build: build:linux

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # git タグ（例: splabo-v0.8.0）からバージョンを取り出して
      # tauri.conf.json と Cargo.toml に書き込む
      - name: Sync version with git tag
        shell: bash
        run: |
          # WiX(MSI) はバージョンに数値3組しか受け付けないため、rc 等のサフィックスを
          # 除いた数値バージョン（例: 0.8.0-rc.1 → 0.8.0）を tauri.conf / Cargo に書き込む。
          # タグ名・リリース名は rc のまま（prerelease として区別）。
          VERSION="${GITHUB_REF_NAME#splabo-v}"
          NUMERIC_VERSION="${VERSION%%-*}"
          node -e "
            const fs = require('fs');
            const path = 'app/src-tauri/tauri.conf.json';
            const conf = JSON.parse(fs.readFileSync(path, 'utf8'));
            conf.version = '${NUMERIC_VERSION}';
            fs.writeFileSync(path, JSON.stringify(conf, null, 2) + '\n');
            console.log('tauri.conf.json version:', conf.version);
          "
          # Cargo.toml の [package] セクションの version を更新
          node -e "
            const fs = require('fs');
            const path = 'app/src-tauri/Cargo.toml';
            const src = fs.readFileSync(path, 'utf8');
            const updated = src.replace(/^version = \"[^\"]*\"/m, 'version = \"${NUMERIC_VERSION}\"');
            fs.writeFileSync(path, updated);
            console.log('Cargo.toml updated');
          "

      # Linux: Tauri が必要とするシステムライブラリ
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      # nxapi-wrapper サイドカーをビルド
      - name: Build nxapi-wrapper sidecar
        working-directory: tools/nxapi-wrapper
        run: |
          npm ci
          npm run ${{ matrix.sidecar-build }}

      # macOS: クロスコンパイル用 Rust ターゲットを追加
      - name: Add Rust target
        if: matrix.rust-target != ''
        run: rustup target add ${{ matrix.rust-target }}

      # フロントエンド依存関係をインストール（ルートで workspace 全体）。
      # Windows 上で生成したルート lockfile には各ランナー OS 版の rollup
      # native optional dep（例: @rollup/rollup-darwin-arm64）の package node が
      # 含まれず、npm ci / npm install は lockfile のツリーを尊重するため、
      # mac-arm 等のランナーで `Cannot find module @rollup/rollup-darwin-arm64`
      # （npm bug #4828）が発生する。ci.yml と同様に npm#4828 の公式回避策どおり
      # lockfile を削除してから install し、ランナー OS 上でプラットフォーム最適な
      # optional deps を解決させる。
      - name: Install app dependencies
        shell: bash
        run: |
          rm -f package-lock.json
          npm install --no-audit --no-fund

      # Tauri ビルド & リリースへアップロード
      - name: Build and upload
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: './app'
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.tauri-args }}

  # ── Step 3: 完了を Slack へ通知（成功・失敗どちらでも最後に1回） ──────────
  # このワークフロー（= リリースのタグ push）からのみ通知が飛ぶ。
  # Slack の Incoming Webhook URL をリポジトリ Secret `SLACK_WEBHOOK_URL` に登録して使う。
  # Secret 未設定なら通知はスキップし、ワークフロー自体は成功のまま。
  notify:
    needs: [create-release, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Notify Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          # build は matrix なので、いずれか失敗したら result は 'failure'
          BUILD_RESULT: ${{ needs.build.result }}
          RELEASE_RESULT: ${{ needs.create-release.result }}
          VERSION: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}
        if: env.SLACK_WEBHOOK_URL != ''
        run: |
          # printf の %s\n で「実際の改行」を入れる（"...\n..." だと Slack に \n が
          # そのまま表示されてしまうため）。jq --arg が改行を JSON へ正しくエスケープする。
          if [ "$BUILD_RESULT" = "success" ] && [ "$RELEASE_RESULT" = "success" ]; then
            TEXT=$(printf '%s\n' \
              "✅ *splabo リリースビルド完了*（成功）" \
              "• バージョン: \`${VERSION}\`" \
              "• リリース（ドラフト）: ${RELEASE_URL}" \
              "• 実行ログ: ${RUN_URL}")
          else
            TEXT=$(printf '%s\n' \
              "❌ *splabo リリースビルド失敗*" \
              "• バージョン: \`${VERSION}\`" \
              "• create-release: ${RELEASE_RESULT} / build: ${BUILD_RESULT}" \
              "• 実行ログ: ${RUN_URL}")
          fi
          # jq でエスケープ済みの JSON を組み立てて POST（メッセージ内の記号・改行で壊れないように）
          PAYLOAD=$(jq -n --arg text "$TEXT" '{text: $text}')
          curl -sS -X POST -H 'Content-Type: application/json' --data "$PAYLOAD" "$SLACK_WEBHOOK_URL"
