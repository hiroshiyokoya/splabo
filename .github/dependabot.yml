# Dependabot の設定（#842・#864）。
#
# 自動 PR は出さない。脆弱性はアラート（Security タブ）だけで知らせてもらい、直すときは手で直す。
# - セキュリティ更新の自動 PR: リポジトリの設定でオフ（nxapi を古い版へ戻す PR が続いたため・#838・#848・#859）
# - 通常の版の更新の PR: open-pull-requests-limit: 0 で出さない
# 下の対象外（ignore）は、セキュリティ更新の自動 PR をオンに戻したときのために残している。
version: 2
updates:
  - package-ecosystem: npm
    directory: /tools/nxapi-wrapper
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    ignore:
      # nxapi は手で上げる（#769 と同じ）。作者が更新を next の開発版（1.6.1-next.N）で出していて、
      # semver ではそれが正式版 1.6.1（2023-03-01）より前と扱われる。Dependabot は「1.6.1 へ上げる」
      # （実際は古い版へ戻す）PR を出してくるので対象外にする（#838）。
      - dependency-name: nxapi
      # sharp は nxapi の依存（Discord のプレゼンス画像用）で、サイドカーのバンドルには入らない。
      # 脆弱性の修正として「sharp を消す」PR が、nxapi ごと古い版へ戻す形で出てくるので対象外にする（#859・#862）。
      - dependency-name: sharp

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
