[workspace]
resolver = "2"
members = [
    "app/src-tauri",
]

# 依存はここでバージョンを一元管理する。
# crate 側は `{ workspace = true, features = [...] }` で参照し、
# feature セットは crate ごとに指定する。
[workspace.dependencies]
tauri = { version = "2.11.1" }
tauri-build = { version = "2.6.1" }
# コンパニオン同期サーバー（#324）: LAN HTTP 配信 + mDNS 広告 + ホスト IP 列挙
tiny_http = { version = "0.12" }
mdns-sd = { version = "0.20" }
if-addrs = { version = "0.15" }
# コンパニオン接続の自己診断（#363）: Windows のネットワークプロファイル判定（NLM/COM）。
# 実際に使うのは Windows ターゲットのみ（crate 側で target 限定＋feature 指定）。
# tauri が使う windows と同じメジャー（0.61）に揃えて重複バージョンを避ける。
windows = { version = "0.61" }
