[package]
name = "splabo"
version = "0.0.0-dev"
description = "Splatoon battle data logger and analytics dashboard"
authors = []
edition = "2021"

[lib]
name = "splabo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { workspace = true, features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# protocol-asset: geartoon 由来のギア画像を asset:// で表示するため（tauri.conf の assetProtocol.enable と対）
tauri = { workspace = true, features = ["tray-icon", "protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "macros"] }
# SQLite に統計関数（corr / stddev 等）を登録するため FFI を直に叩く（#573）。
# sqlx が既に同じバージョンに依存しており、sqlx の "sqlite" feature 経由で bundled
# 済みなので、ここで直接依存に足しても同じ SQLite にリンクされる。
libsqlite3-sys = "0.30"
# Nintendo auth
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "v5"] }
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
# ギアデータ暗号化（geartoon 由来・gear_crypto.rs / gear-export-v1 契約）
aes-gcm = "0.10"
chrono = { version = "0.4", features = ["serde"] }
csv = "1.3"
zip = { version = "2", default-features = false, features = ["deflate"] }
# スマホで見る（スマホ Web 版のサーバー・companion.rs）
tiny_http = { workspace = true }
if-addrs = { workspace = true }
tauri-plugin-dialog = "2"
# 最新リリースの版と今の版を比べる（#542）。tauri の package_info().version と同じ型
semver = "1"

# Windows のみ: コンパニオン接続の自己診断（#363・companion.rs の detect_network_category）。
# Network List Manager（COM）でネットワークプロファイル（Public/Private/Domain）を判定する。
[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = [
    "Win32_Globalization",
    "Win32_Networking_NetworkListManager",
    "Win32_System_Com",
    # ファイアウォールの受信規則を読む（#370・companion.rs の detect_inbound_allowed）
    "Win32_NetworkManagement_WindowsFirewall",
    "Win32_System_Ole",
    "Win32_System_Variant",
] }

# Linux のみ: トレイアイコンに要る appindicator のライブラリが読めるかを、トレイを作る前に確かめる（#835）。
# 読めないまま作ると libappindicator-sys が panic して起動できない。版は libappindicator-sys と同じ。
[target.'cfg(target_os = "linux")'.dependencies]
libloading = "0.7"
